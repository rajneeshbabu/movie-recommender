<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Movie Recommender</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --purple: #7c3aed;
    --pink:   #ec4899;
    --gold:   #f59e0b;
    --bg:     #0a0a0f;
    --card:   rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0f0c29, #302b63);
    padding: 3rem 1rem 2.5rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, #a78bfa, #ec4899, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: .5rem;
  }
  header p { color: #94a3b8; font-size: 1.1rem; }

  .search-section {
    max-width: 700px;
    margin: 2.5rem auto;
    padding: 0 1rem;
  }

  /* ── Custom select dropdown ── */
  .select-wrap { position: relative; }

  .select-display {
    width: 100%;
    padding: .9rem 2.8rem .9rem 1.2rem;
    font-size: 1rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: #e2e8f0;
    cursor: pointer;
    user-select: none;
    transition: border-color .2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .select-display:hover, .select-display.open {
    border-color: var(--purple);
    background: rgba(255,255,255,0.08);
  }
  .select-display .arrow {
    color: #64748b;
    font-size: .8rem;
    transition: transform .2s;
    flex-shrink: 0;
  }
  .select-display.open .arrow { transform: rotate(180deg); }
  .select-display .placeholder { color: #64748b; }

  /* Search inside dropdown */
  .dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #1a1728;
    border: 1px solid rgba(124,58,237,.4);
    border-radius: 14px;
    z-index: 200;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
    overflow: hidden;
  }
  .dropdown-panel.open { display: block; }

  .dropdown-search {
    width: 100%;
    padding: .75rem 1.1rem;
    background: rgba(255,255,255,0.06);
    border: none;
    border-bottom: 1px solid var(--border);
    color: #e2e8f0;
    font-size: .95rem;
    outline: none;
  }
  .dropdown-search::placeholder { color: #475569; }

  .dropdown-list {
    max-height: 280px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .dropdown-list::-webkit-scrollbar { width: 6px; }
  .dropdown-list::-webkit-scrollbar-track { background: transparent; }
  .dropdown-list::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 4px; }

  .drop-item {
    padding: .65rem 1.1rem;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.03);
    transition: background .12s;
  }
  .drop-item:hover, .drop-item.focused {
    background: rgba(124,58,237,.28);
  }
  .drop-item .di-title { font-weight: 600; font-size: .92rem; }
  .drop-item .di-meta  { font-size: .75rem; color: #64748b; margin-top: 1px; }
  .drop-item mark {
    background: rgba(124,58,237,.45);
    color: #c4b5fd;
    border-radius: 3px;
    padding: 0 2px;
  }

  .no-results {
    padding: 1.2rem;
    text-align: center;
    color: #475569;
    font-size: .9rem;
  }

  /* ── Button ── */
  .search-btn {
    width: 100%;
    margin-top: .8rem;
    padding: .85rem;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: .4px;
    box-shadow: 0 4px 20px rgba(124,58,237,.4);
    transition: all .2s;
  }
  .search-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(124,58,237,.6);
  }
  .search-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── Loader ── */
  #loader {
    display: none;
    text-align: center;
    padding: 2.5rem;
    color: #94a3b8;
  }
  .spinner {
    display: inline-block;
    width: 38px; height: 38px;
    border: 3px solid rgba(124,58,237,.3);
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: .7rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Results ── */
  #results {
    max-width: 900px;
    margin: 0 auto 4rem;
    padding: 0 1rem;
  }
  .results-title {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: #c4b5fd;
    margin-bottom: 1.5rem;
  }
  .results-title span { color: var(--pink); }

  /* ── Movie card ── */
  .movie-card {
    display: flex;
    gap: 1.2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem;
    margin-bottom: 1rem;
    transition: all .25s;
    animation: fadeUp .35s ease both;
  }
  .movie-card:hover {
    border-color: rgba(124,58,237,.5);
    background: rgba(124,58,237,.08);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .movie-card:nth-child(2){animation-delay:.05s}
  .movie-card:nth-child(3){animation-delay:.1s}
  .movie-card:nth-child(4){animation-delay:.15s}
  .movie-card:nth-child(5){animation-delay:.2s}
  .movie-card:nth-child(6){animation-delay:.25s}

  .card-rank {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #a78bfa, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    min-width: 2.2rem;
    text-align: center;
    line-height: 1;
    padding-top: .2rem;
  }
  .card-poster {
    width: 90px; min-width: 90px; height: 130px;
    border-radius: 10px; object-fit: cover;
  }
  .poster-placeholder {
    width: 90px; min-width: 90px; height: 130px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    display: flex; align-items: center;
    justify-content: center;
    font-size: 2rem; color: #334155;
  }
  .card-info { flex: 1; }
  .card-title { font-size:1.1rem; font-weight:700; color:#f1f5f9; margin-bottom:.3rem; }
  .card-year  { color:#64748b; font-size:.85rem; margin-bottom:.5rem; }

  .tags { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.5rem; }
  .tag  { padding:2px 10px; border-radius:20px; font-size:.72rem; font-weight:600; }
  .tag-genre  { background:rgba(124,58,237,.25); color:#a78bfa; border:1px solid rgba(124,58,237,.35); }
  .tag-rating { background:rgba(245,158,11,.2);  color:#f59e0b; border:1px solid rgba(245,158,11,.35); }
  .tag-match  { background:rgba(16,185,129,.15); color:#34d399; border:1px solid rgba(16,185,129,.3); }

  .card-overview {
    font-size:.83rem; color:#94a3b8; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:3;
    -webkit-box-orient:vertical; overflow:hidden;
  }

  .msg { text-align:center; padding:2rem; color:#64748b; }

  footer {
    text-align:center; padding:1.5rem;
    color:#334155; font-size:.8rem;
    border-top:1px solid var(--border);
  }
  footer a { color:#7c3aed; text-decoration:none; }

  @media(max-width:560px){
    .card-poster,.poster-placeholder{width:68px;min-width:68px;height:100px;}
    .card-rank{font-size:1.5rem;}
  }
</style>
</head>
<body>

<header>
  <h1>🎬 Movie Recommender</h1>
  <p>4,796 movies · Content-based filtering · TMDB data</p>
</header>

<div class="search-section">

  <!-- Custom scrollable select -->
  <div class="select-wrap" id="selectWrap">
    <div class="select-display" id="selectDisplay" tabindex="0">
      <span class="placeholder" id="displayText">Click to browse all movies…</span>
      <span class="arrow">▼</span>
    </div>

    <div class="dropdown-panel" id="dropdownPanel">
      <input class="dropdown-search" id="dropdownSearch"
             placeholder="Type to filter movies…" autocomplete="off" spellcheck="false"/>
      <div class="dropdown-list" id="dropdownList"></div>
    </div>
  </div>

  <button class="search-btn" id="recommendBtn" disabled>Get Recommendations</button>
</div>

<div id="loader">
  <div class="spinner"></div>
  <p id="loaderMsg">Loading movie data…</p>
</div>

<div id="results"></div>

<footer>
  Built with TF-IDF · Cosine Similarity · TMDB API &nbsp;|&nbsp;
  <a href="https://github.com/rajneeshbabu/movie-recommender" target="_blank">GitHub</a>
</footer>

<script>
const TMDB_KEY  = '8265bd1679663a7ea12ac168da84d2e8';
const IMG_BASE  = 'https://image.tmdb.org/t/p/w300';

let allMovies     = [];
let recMap        = {};
let selectedTitle = null;
let currentFilter = '';

// ── Elements ────────────────────────────────────────────────────────────────
const selectDisplay  = document.getElementById('selectDisplay');
const displayText    = document.getElementById('displayText');
const dropdownPanel  = document.getElementById('dropdownPanel');
const dropdownSearch = document.getElementById('dropdownSearch');
const dropdownList   = document.getElementById('dropdownList');
const recommendBtn   = document.getElementById('recommendBtn');

// ── Open / close dropdown ───────────────────────────────────────────────────
function openDropdown() {
  dropdownPanel.classList.add('open');
  selectDisplay.classList.add('open');
  dropdownSearch.value = '';
  currentFilter = '';
  renderDropdown('');
  setTimeout(() => dropdownSearch.focus(), 50);
}
function closeDropdown() {
  dropdownPanel.classList.remove('open');
  selectDisplay.classList.remove('open');
}

selectDisplay.addEventListener('click', () =>
  dropdownPanel.classList.contains('open') ? closeDropdown() : openDropdown());

selectDisplay.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDropdown(); }
});

document.addEventListener('click', e => {
  if (!document.getElementById('selectWrap').contains(e.target)) closeDropdown();
});

// ── Render dropdown items ───────────────────────────────────────────────────
function renderDropdown(query) {
  const q = query.trim().toLowerCase();
  const filtered = q.length === 0
    ? allMovies                               // show all when no query
    : allMovies.filter(m => m.title.toLowerCase().includes(q));

  if (filtered.length === 0) {
    dropdownList.innerHTML = '<div class="no-results">No movies found</div>';
    return;
  }

  // Render up to 200 items for performance; search narrows it down
  const items = filtered.slice(0, 200);
  dropdownList.innerHTML = items.map(m => {
    const titleHtml = q
      ? m.title.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),
          '<mark>$1</mark>')
      : m.title;
    return `<div class="drop-item" data-title="${m.title.replace(/"/g,'&quot;')}">
      <div class="di-title">${titleHtml}</div>
      <div class="di-meta">${m.year || ''} · ${(m.genres||'').split(',')[0]||''} · ⭐ ${m.rating}</div>
    </div>`;
  }).join('');

  // Show count hint if filtered > 200
  if (filtered.length > 200) {
    dropdownList.insertAdjacentHTML('beforeend',
      `<div class="no-results" style="font-size:.75rem">Showing 200 of ${filtered.length} — type to narrow</div>`);
  }

  dropdownList.querySelectorAll('.drop-item').forEach(el => {
    el.addEventListener('click', () => {
      selectedTitle = el.dataset.title;
      displayText.textContent = selectedTitle;
      displayText.style.color = '#e2e8f0';
      recommendBtn.disabled = false;
      closeDropdown();
    });
  });
}

// Filter as user types inside dropdown
dropdownSearch.addEventListener('input', () => {
  currentFilter = dropdownSearch.value;
  renderDropdown(currentFilter);
});

dropdownSearch.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDropdown();
});

// ── Recommend ───────────────────────────────────────────────────────────────
recommendBtn.addEventListener('click', () => {
  if (!selectedTitle) return;
  const recs = recMap[selectedTitle];
  if (!recs || recs.length === 0) {
    document.getElementById('results').innerHTML = '<p class="msg">No recommendations found.</p>';
    return;
  }
  document.getElementById('loader').style.display = 'block';
  document.getElementById('loaderMsg').textContent = 'Finding recommendations…';
  document.getElementById('results').innerHTML = '';
  setTimeout(() => {
    renderCards(selectedTitle, recs);
    document.getElementById('loader').style.display = 'none';
  }, 150);
});

// ── Render result cards ──────────────────────────────────────────────────────
async function fetchPoster(movieId) {
  try {
    const r    = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_KEY}`);
    const data = await r.json();
    return data.poster_path ? IMG_BASE + data.poster_path : null;
  } catch { return null; }
}

async function renderCards(queryTitle, recs) {
  const container = document.getElementById('results');
  container.innerHTML = `
    <div class="results-title">Because you liked <span>${queryTitle}</span></div>
    ${recs.map((m, i) => `
      <div class="movie-card">
        <div class="card-rank">#${i+1}</div>
        <div class="poster-placeholder" id="poster-${i}">🎬</div>
        <div class="card-info">
          <div class="card-title">${m.title}</div>
          <div class="card-year">${m.year || 'N/A'}</div>
          <div class="tags">
            ${(m.genres||'').split(',').filter(Boolean).slice(0,3)
              .map(g=>`<span class="tag tag-genre">${g.trim()}</span>`).join('')}
            <span class="tag tag-rating">⭐ ${m.rating}</span>
            <span class="tag tag-match">Match ${m.match}%</span>
          </div>
          <div class="card-overview">${m.overview}</div>
        </div>
      </div>`).join('')}`;

  recs.forEach(async (m, i) => {
    const url = await fetchPoster(m.movie_id);
    const el  = document.getElementById(`poster-${i}`);
    if (url && el) {
      el.outerHTML = `<img class="card-poster" src="${url}" alt="${m.title}" loading="lazy"
        onerror="this.outerHTML='<div class=\\'poster-placeholder\\'>🎬</div>'"/>`;
    }
  });
}

// ── Load data.zip ────────────────────────────────────────────────────────────
(async () => {
  const loader = document.getElementById('loader');
  const msg    = document.getElementById('loaderMsg');
  loader.style.display = 'block';
  msg.textContent = 'Loading movie data…';

  try {
    const resp   = await fetch('Dataset/data.zip');
    const buffer = await resp.arrayBuffer();
    const zip    = await JSZip.loadAsync(buffer);
    const text   = await zip.file('data.json').async('string');
    const json   = JSON.parse(text);

    allMovies = json.movies;
    recMap    = json.recommendations;

    loader.style.display = 'none';
    selectDisplay.querySelector('.placeholder').textContent =
      `Click to browse ${allMovies.length.toLocaleString()} movies…`;
    displayText.textContent =
      `Click to browse ${allMovies.length.toLocaleString()} movies…`;
  } catch(e) {
    loader.style.display = 'none';
    document.getElementById('results').innerHTML =
      '<p class="msg">Failed to load data.zip. Make sure it is in the same folder as index.html.</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
